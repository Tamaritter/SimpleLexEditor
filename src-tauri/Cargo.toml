[package]
name = "simplelexeditor"
version = "1.6.0"
description = "Lokaler LaTeX-Editor für Windows mit PDF-Live-Vorschau."
authors = ["Roxena"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "simplelexeditor_lib"
crate-type = ["rlib"]

[features]
bundled-tex = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "9.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Globalization"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
