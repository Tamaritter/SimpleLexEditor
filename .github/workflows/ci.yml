name: SimpleLexEditor verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      offline_package:
        description: Build and verify the complete Windows offline package
        type: boolean
        default: false
      tex_archive_url:
        description: HTTPS download URL for the locked TeX archive (optional)
        type: string
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Rust toolchain
        run: rustup update stable
      - name: Format and type checks
        run: |
          npx prettier --check src tests
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Unit tests
        run: npm test
      - name: Browser regression tests
        run: |
          npx playwright install chromium
          npm run test:e2e
      - name: Rust filesystem and process tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Dependency security
        run: |
          npm audit
          npm run audit:rust
      - name: Cache offline TeX payload
        if: inputs.offline_package
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: src-tauri/resources/tex-runtime.exe
          key: simplelexeditor-tex-${{ hashFiles('scripts/build/tex-runtime.lock.json') }}
      - name: Prepare offline TeX distribution
        if: inputs.offline_package
        env:
          SIMPLELEXEDITOR_TEX_ARCHIVE_URL: ${{ inputs.tex_archive_url }}
        run: |
          if ($env:SIMPLELEXEDITOR_TEX_ARCHIVE_URL -and -not (Test-Path -LiteralPath 'src-tauri/resources/tex-runtime.exe')) {
            $env:SIMPLELEXEDITOR_TEX_ARCHIVE = Join-Path $env:RUNNER_TEMP 'simplelexeditor-tex-runtime.exe'
            curl.exe --fail --location --silent --show-error --proto '=https' --proto-redir '=https' --output $env:SIMPLELEXEDITOR_TEX_ARCHIVE -- $env:SIMPLELEXEDITOR_TEX_ARCHIVE_URL
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/build/prepare-tex.ps1
      - name: Build Windows application
        if: inputs.offline_package
        run: |
          npm run notices
          ./scripts/build/build.ps1 '--' '--locked'
      - name: Verify bundled TeX in the desktop application
        if: inputs.offline_package
        run: ./tests/native/native-check.ps1 -IncludeScientific
      - name: Package candidate and verify artifacts
        if: inputs.offline_package
        shell: pwsh
        run: |
          ./scripts/release/release.ps1 -SkipBuild
          npm run verify:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: simplelexeditor-verification
          path: |
            test-results
            .tools/rust-security-audit.json
            .tools/installer-verification.json
            release
          retention-days: 14
