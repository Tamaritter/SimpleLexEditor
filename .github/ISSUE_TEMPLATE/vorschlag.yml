name: Verbesserung vorschlagen
description: Schlage eine Änderung für deinen LaTeX-Arbeitsablauf vor.
body:
  - type: textarea
    id: goal
    attributes:
      label: Was möchtest du in SimpleLexEditor erreichen?
      description: Beschreibe deinen Arbeitsablauf und wo du dabei hängenbleibst.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Welche Änderung würde dir helfen?
      description: Wenn du schon eine Idee hast, beschreibe, wie sich die Änderung bedienen lassen soll.
